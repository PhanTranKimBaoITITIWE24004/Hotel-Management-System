<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head('Guest Form')">
  <link rel="stylesheet" href="/main.css" th:href="@{/main.css}">
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar('guests')"></div>

<div class="main-wrapper">
  <header class="topbar">
    <div>
      <div class="topbar-title"
           th:text="${guest.id != null ? 'Edit Guest' : 'Register New Guest'}">Register New Guest</div>
      <div class="topbar-bc">
        <a th:href="@{/guests}" style="color:var(--gold);">Guests</a> /
        <span th:text="${guest.id != null ? 'Edit' : 'New'}">New</span>
      </div>
    </div>
  </header>

  <div class="page-content">

    <div style="max-width: 720px;">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title"
                 th:text="${guest.id != null ? 'Edit Guest Profile' : 'Register New Guest'}">Register New Guest</div>
            <div class="card-subtitle">All fields marked * are required for ID verification at check-in</div>
          </div>
        </div>

        <!-- Server-side error -->
        <div th:if="${errorMessage}" class="alert alert-danger"
             style="margin:16px 24px 0" th:text="${errorMessage}">Error</div>

        <form th:action="@{/guests}" method="post"
              th:object="${guest}" id="guest-form" novalidate>
          <input type="hidden" th:field="*{id}">
          <input type="hidden" th:if="${_csrf != null}"
                 th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <div class="card-body">
            <!-- Personal section -->
            <div class="form-section-title">Personal Details</div>

            <div class="form-group">
              <label for="fullName" class="required">Full Name</label>
              <input id="fullName" type="text"
                     th:field="*{fullName}"
                     class="form-control"
                     th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'"
                     placeholder="e.g. Nguyen Van A"
                     maxlength="150" required>
              <div class="invalid-feedback"
                   th:if="${#fields.hasErrors('fullName')}"
                   th:errors="*{fullName}">Required</div>
              <div class="form-hint" th:unless="${#fields.hasErrors('fullName')}">
                Must match the ID document exactly
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                       placeholder="guest@example.com">
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Invalid email</div>
                <div class="form-hint" th:unless="${#fields.hasErrors('email')}">
                  For booking confirmations &amp; receipts
                </div>
              </div>

              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input id="phone" type="tel"
                       th:field="*{phone}"
                       class="form-control"
                       placeholder="e.g. 0901234567">
              </div>
            </div>

            <div class="form-group">
              <label for="address">Address</label>
              <textarea id="address" rows="2"
                        th:field="*{address}"
                        class="form-control"
                        placeholder="e.g. Ho Chi Minh City, Vietnam"></textarea>
            </div>

            <!-- ID section -->
            <div class="form-section-title" style="margin-top: 8px;">Identification</div>

            <div class="form-row">
              <div class="form-group">
                <label class="required">ID Document Type</label>
                <select th:field="*{idType}" class="form-control" required>
                  <option value="">— Select —</option>
                  <option value="PASSPORT">Passport</option>
                  <option value="NATIONAL_ID">National ID Card</option>
                  <option value="DRIVING_LICENSE">Driving License</option>
                </select>
              </div>

              <div class="form-group">
                <label for="idNumber" class="required">ID Number</label>
                <input id="idNumber" type="text"
                       th:field="*{idNumber}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('idNumber')} ? ' is-invalid'"
                       placeholder="e.g. 079090123456"
                       maxlength="50" required>
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('idNumber')}"
                     th:errors="*{idNumber}">Required</div>
              </div>
            </div>
          </div>

          <div class="card-footer" style="background: var(--white); justify-content: flex-end;">
            <a th:href="@{/guests}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-gold">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span th:text="${guest.id != null ? 'Save Changes' : 'Register Guest'}">Register Guest</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<div th:replace="fragments/confirm-dialog :: dialog"></div>
<div th:replace="fragments/confirm-dialog :: toasts"></div>
<div th:replace="fragments/confirm-dialog :: flash"></div>
<script th:src="@{/main.js}"></script>
</body>
</html>
