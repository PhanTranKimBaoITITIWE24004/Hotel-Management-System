<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="en">
<head th:replace="fragments/head :: head('Rooms')"></head>
<body>

<div th:replace="fragments/sidebar :: sidebar('rooms')"></div>

<div class="main-wrapper">
  <div th:replace="fragments/topbar :: topbar('Rooms','Operations / Room inventory')"></div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title-h1">Room Inventory</div>
        <div class="page-title-sub">
          <span th:text="${totalRooms != null ? totalRooms : 0}">0</span> rooms across
          <span th:text="${totalCategories != null ? totalCategories : 0}">0</span> categories
        </div>
      </div>
      <div class="page-header-actions">
        <a th:href="@{/rooms/new}" class="btn btn-gold" sec:authorize="hasRole('ADMIN')">Add Room</a>
      </div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <div class="search-wrap"><input id="room-search" class="search-input" placeholder="Search by room number…" type="text"></div>
        <select id="status-filter" class="filter-select">
          <option value="">All Statuses</option>
          <option value="AVAILABLE">Available</option>
          <option value="OCCUPIED">Occupied</option>
          <option value="CLEANING">Cleaning</option>
          <option value="MAINTENANCE">Maintenance</option>
        </select>
        <select id="category-filter" class="filter-select">
          <option value="">All Categories</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Standard</option>
        </select>
      </div>

      <div class="rooms-grid" id="rooms-grid">
        <div th:each="r : ${rooms}" class="room-card"
             th:attr="data-status=${r.status},data-category=${r.categoryId != null ? r.categoryId : ''},data-number=${r.roomNumber}">
          <div class="room-card-header">
            <div class="room-number" th:text="${r.roomNumber}">101</div>
            <div class="room-type-label" th:text="${r.categoryName != null ? r.categoryName : 'Room'}">Standard</div>
          </div>
          <div class="room-card-body">
            <div class="room-meta">Floor <span th:text="${r.floor != null ? r.floor : '-'}">1</span></div>
            <div class="room-meta">Status <span th:text="${r.status != null ? r.status : 'AVAILABLE'}">AVAILABLE</span></div>
          </div>
        </div>
        <div th:if="${rooms == null or #lists.isEmpty(rooms)}" class="table-empty" style="grid-column:1/-1;">No rooms configured yet</div>
      </div>
    </div>
  </div>
</div>

<div th:replace="fragments/confirm-dialog :: dialog"></div>
<div th:replace="fragments/confirm-dialog :: toasts"></div>
<div th:replace="fragments/confirm-dialog :: flash"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
