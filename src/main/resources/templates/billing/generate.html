<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head('Generate Invoice')"><meta charset="utf-8">
  <link rel="stylesheet" href="/main.css" th:href="@{/main.css}">
</head>
<body>
<div style="display:flex">
  <div th:replace="fragments/sidebar :: sidebar('billing')"></div>
  <div class="main-wrapper">
    <div th:replace="fragments/topbar :: topbar('Generate Invoice', 'Billing / Generate')"></div>
    <div class="page-content">
      <div style="max-width:720px;margin:0 auto">

        <div class="page-header" style="margin-bottom:20px">
          <div>
            <h1 class="page-title-h1">Generate Invoice</h1>
            <p class="page-title-sub">Create a bill for a completed or active booking</p>
          </div>
          <a th:href="@{/billing}" class="btn btn-outline">← Back</a>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">Invoice Details</div></div>
          <div class="card-body">
            <form th:action="@{/billing/save}" th:object="${bill}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <!-- Booking selector -->
              <div class="form-section-title">Booking</div>
              <div class="form-group">
                <label for="bookingId" class="required">Select Booking</label>
                <select id="bookingId" name="bookingId" class="form-control" required
                        onchange="loadBookingDetails(this.value)">
                  <option value="">— Select a checked-in booking —</option>
                  <option th:each="b : ${checkedInBookings}"
                          th:value="${b.id}"
                          th:text="'#BK-' + ${b.id} + ' — ' + ${b.guest.fullName} + ' (Room ' + ${b.room.roomNumber} + ')'"
                          th:selected="${preselectedBookingId != null and b.id == preselectedBookingId}"
                          th:data-room-rate="${b.room.category.pricePerNight}"
                          th:data-nights="${#temporals.between(b.checkInDate, b.checkOutDate).getDays()}"
                          th:data-food="${bookingFoodTotals[b.id] ?: 0}">
                  </option>
                </select>
              </div>

              <!-- Booking summary panel -->
              <div id="booking-summary"
                   style="background:var(--cream);border-radius:var(--r);padding:16px;margin-bottom:16px;display:none">
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;
                            color:var(--muted);margin-bottom:10px">Booking Summary</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px">
                  <div><span style="color:var(--muted)">Nights: </span><strong id="sum-nights">—</strong></div>
                  <div><span style="color:var(--muted)">Rate: </span><strong id="sum-rate">—</strong></div>
                </div>
              </div>

              <!-- Charges -->
              <div class="form-section-title" style="margin-top:4px">Charges</div>
              <div class="form-row" style="margin-bottom:16px">
                <div class="form-group mb-0">
                  <label for="roomCharges" class="required">Room Charges ($)</label>
                  <input id="roomCharges" th:field="*{roomCharges}" type="number"
                         step="0.01" min="0" class="form-control"
                         th:classappend="${#fields.hasErrors('roomCharges')} ? ' is-invalid'"
                         placeholder="0.00" required>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('roomCharges')}"
                       th:errors="*{roomCharges}"></div>
                </div>
                <div class="form-group mb-0">
                  <label for="foodCharges">Food &amp; Beverage Charges ($)</label>
                  <input id="foodCharges" th:field="*{foodCharges}" type="number"
                         step="0.01" min="0" class="form-control"
                         placeholder="0.00" value="0">
                </div>
              </div>

              <!-- Live total preview -->
              <div class="bill-preview">
                <div class="bill-line">
                  <span style="color:var(--muted)">Room Charges</span>
                  <span id="preview-room">$0.00</span>
                </div>
                <div class="bill-line">
                  <span style="color:var(--muted)">Food &amp; Beverage</span>
                  <span id="preview-food">$0.00</span>
                </div>
                <div class="bill-line total">
                  <span>Total Due</span>
                  <span class="bill-total-amount" id="totalPreview">$0.00</span>
                </div>
              </div>

              <div class="form-actions">
                <a th:href="@{/billing}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-gold">Issue Invoice</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
  // Booking data map from Thymeleaf
  const bookingData = {};
  document.querySelectorAll('#bookingId option[data-room-rate]').forEach(opt => {
    bookingData[opt.value] = {
      rate:  parseFloat(opt.dataset.roomRate  || 0),
      nights: parseInt(opt.dataset.nights     || 0),
      food:   parseFloat(opt.dataset.food     || 0),
    };
  });

  function loadBookingDetails(id) {
    const d = bookingData[id];
    const summary = document.getElementById('booking-summary');
    if (d && id) {
      document.getElementById('sum-nights').textContent = d.nights + ' night(s)';
      document.getElementById('sum-rate').textContent   = '$' + d.rate.toFixed(2) + '/night';
      document.getElementById('roomCharges').value = (d.rate * d.nights).toFixed(2);
      document.getElementById('foodCharges').value = d.food.toFixed(2);
      summary.style.display = 'block';
    } else {
      summary.style.display = 'none';
    }
    updatePreview();
  }

  function updatePreview() {
    const r = parseFloat(document.getElementById('roomCharges').value) || 0;
    const f = parseFloat(document.getElementById('foodCharges').value) || 0;
    document.getElementById('preview-room').textContent = '$' + r.toFixed(2);
    document.getElementById('preview-food').textContent = '$' + f.toFixed(2);
    document.getElementById('totalPreview').textContent = '$' + (r + f).toLocaleString('en-US', {minimumFractionDigits:2});
  }

  document.getElementById('roomCharges')?.addEventListener('input', updatePreview);
  document.getElementById('foodCharges')?.addEventListener('input', updatePreview);

  // Auto-select if preselected from booking detail page
  const preselect = document.getElementById('bookingId').value;
  if (preselect) loadBookingDetails(preselect);
</script>
</body>
</html>
