<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxeStay — Hotel Management System</title>
<link rel="stylesheet" href="/main.css" th:href="@{/main.css}">
</head>
<body>
<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-title">LuxeStay</div>
      <div class="login-subtitle">Hotel Management System</div>
    </div>
    <div class="login-form-h">Sign in to your account</div>
    <div class="login-form-sub">Enter your credentials to access the hotel console</div>

    <!-- Error/Success Banners -->
    <div th:if="${param.error}" style="background: #FDF2F2; color: #9B1C1C; border: 1px solid #F8B4B4; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center; font-weight: 500;">
        Invalid email address or password.
    </div>
    <div th:if="${param.logout}" style="background: #F3FAF7; color: #03543F; border: 1px solid #DEF7EC; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center; font-weight: 500;">
        Logged out successfully.
    </div>

    <!-- Spring Security Login Form -->
    <form th:action="@{/login}" method="post">
      <div class="fg">
        <label for="username">Email Address</label>
        <input type="email" id="username" name="username" placeholder="admin@luxestay.com" required autocomplete="email">
      </div>
      <div class="fg">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Sign In to Dashboard</button>
    </form>
  </div>
</div>
</body>
</html>
