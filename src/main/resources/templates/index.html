<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxeStay — Hotel Management System</title>
<link rel="stylesheet" href="/main.css" th:href="@{/main.css}">
</head>
<body>
<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-title">LuxeStay</div>
      <div class="login-subtitle">Hotel Management System</div>
    </div>
    <div class="login-form-h">Sign in to your account</div>
    <div class="fg">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="Your email address">
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In to Dashboard</button>
  </div>
</div>
</body>
