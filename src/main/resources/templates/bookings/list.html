<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head('Bookings')"></head>
<body>
<div th:replace="fragments/sidebar :: sidebar('bookings')"></div>
<div class="main-wrapper">
    <div th:replace="fragments/topbar :: topbar('Bookings','Front Desk / Reservations')"></div>
    <div class="page-content">
        <div class="page-header">
            <div>
                <div class="page-title-h1">Bookings</div>
                <div class="page-title-sub">
                    Manage reservations and guest stays
                </div>
            </div>
            <div class="page-header-actions">
                <a th:href="@{/bookings/new}" class="btn btn-gold">
                    + New Booking
                </a>
            </div>
        </div>
        
        <div class="card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Guest</th>
                        <th>Email</th>
                        <th>Room</th>
                        <th>Category</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Total Bill</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bookings == null or #lists.isEmpty(bookings)}">
                        <td colspan="10" class="table-empty" style="text-align: center; padding: 2rem;">
                            No bookings found in the database.
                        </td>
                    </tr>
                    
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${booking.id}">1</td>
                        <td th:text="${booking.guestName}">Nguyen Van A</td>
                        <td th:text="${booking.guestEmail}">nguyenvana@example.com</td>
                        <td th:text="${booking.roomNumber}">101</td>
                        <td th:text="${booking.roomCategory}">Deluxe</td>
                        
                        <td th:text="${#temporals.format(booking.checkInDate, 'dd-MM-yyyy')}">01-06-2026</td>
                        <td th:text="${#temporals.format(booking.checkOutDate, 'dd-MM-yyyy')}">03-06-2026</td>
                        
                        <td th:text="${booking.paymentMethod}">CASH</td>
                        
                        <td>
                            <span class="badge"
                                  th:classappend="${
                                      booking.status == 'RESERVED' ? 'badge-primary' : 
                                      (booking.status == 'CHECKED_IN' ? 'badge-warning' : 
                                      (booking.status == 'CHECKED_OUT' ? 'badge-success' : 'badge-secondary'))
                                  }"
                                  th:text="${booking.status}">
                                RESERVED
                            </span>
                        </td>
                        
                        <td th:text="${booking.totalAmount != null ? '$' + #numbers.formatDecimal(booking.totalAmount, 1, 2) : 'Pending'}">
                            $0.00
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
