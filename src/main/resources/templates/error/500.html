<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Server Error')}"></head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream)">
  <div style="text-align:center;max-width:480px;padding:40px 20px">
    <div style="width:64px;height:64px;background:var(--d-bg);border-radius:50%;display:flex;align-items:center;
                justify-content:center;margin:0 auto 20px">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--d-c)" stroke-width="2" style="width:30px;height:30px">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div style="font-family:var(--fd);font-size:26px;color:var(--navy);margin-bottom:10px">Something Went Wrong</div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:24px">
      An unexpected server error occurred. Please try again or contact support.
    </p>
    <p style="font-size:12px;color:var(--light);font-family:monospace;background:var(--g-bg);
              padding:8px 14px;border-radius:var(--r);margin-bottom:24px"
       th:text="${message != null ? message : 'Internal Server Error'}">Error</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <a th:href="@{/dashboard}" class="btn btn-navy">Go to Dashboard</a>
      <a onclick="location.reload()" href="#" class="btn btn-outline">Try Again</a>
    </div>
  </div>
</body>
</html>
